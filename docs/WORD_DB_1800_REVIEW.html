<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보카 스터디 — 1,800어 최종 사람 검토 및 릴리스 동결 뷰어 (QA-03)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --tag-bg: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .status-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .control-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .export-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }
    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #1e293b;
      color: var(--text-muted);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    tr:hover { background: rgba(255, 255, 255, 0.02); }
    .word-title { font-weight: 700; font-size: 15px; color: #60a5fa; }
    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      background: var(--tag-bg);
      margin-right: 4px;
    }
    .status-select {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      font-weight: 600;
      width: 100%;
    }
    .note-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>보카 스터디 — 1,800어 최종 사람 검토 및 릴리스 동결 뷰어 (QA-03)</h1>
    <p style="color: var(--text-muted); font-size: 14px;">
      전체 1,800개 DB 중 유의어 분리 후 인간 집중 검수 대상 <strong style="color: #60a5fa;">198개</strong> (QA-01 1,007개에서 80.3% 압축 완료)
    </p>
    <div class="status-badges">
      <span class="badge badge-pass">기술 상태: QA_02_SEMANTIC_NORMALIZATION_PASS</span>
      <span class="badge badge-pending">사람 검토: HUMAN_REVIEW_PENDING</span>
      <span class="badge badge-danger">1,800 Release Ready: NO (실제 사람 검토 전 동결)</span>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>단어/뜻 검색</label>
      <input type="text" id="searchInput" placeholder="영단어 또는 한국어 뜻..." oninput="renderTable()">
    </div>
    <div class="control-group">
      <label>검토 필터 (지시서 31항)</label>
      <select id="categorySelect" onchange="renderTable()">
        <option value="ALL">전체 보기</option>
        <option value="B_GRADE">1. B등급 어휘</option>
        <option value="GENUINE_POLYSEMY">2. 실제 다의어 (VALID_SENSE)</option>
        <option value="SPACING_NORMALIZED">3. 띄어쓰기 정규화 확인</option>
        <option value="HARD_PHRASAL_OR_EXPR">4. 직역 위험 구동사/표현</option>
      </select>
    </div>
    <div class="control-group">
      <label>품사</label>
      <select id="posSelect" onchange="renderTable()">
        <option value="ALL">전체 품사</option>
        <option value="noun">명사 (noun)</option>
        <option value="verb">동사 (verb)</option>
        <option value="adjective">형용사 (adjective)</option>
        <option value="adverb">부사 (adverb)</option>
        <option value="phrase">표현 (phrase)</option>
      </select>
    </div>
    <div class="control-group">
      <label>난이도</label>
      <select id="diffSelect" onchange="renderTable()">
        <option value="ALL">전체 난이도</option>
        <option value="easy">하 (easy)</option>
        <option value="medium">중 (medium)</option>
        <option value="hard">상 (hard)</option>
      </select>
    </div>
    <div class="control-group">
      <label>검토 상태</label>
      <select id="statusFilter" onchange="renderTable()">
        <option value="ALL">전체 상태</option>
        <option value="UNREVIEWED">미검토</option>
        <option value="APPROVED">정상 (APPROVED)</option>
        <option value="NEEDS_CORRECTION">수정 필요</option>
        <option value="EXCLUDE">제외</option>
        <option value="HOLD">보류</option>
      </select>
    </div>
  </div>

  <div class="export-bar">
    <div id="countSummary">조회 건수: 0개</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="btn btn-secondary" onclick="batchApproveFiltered()">현재 필터 항목 정상(approved) 일괄 설정</button>
      <button class="btn btn-secondary" onclick="batchApproveAll()">전체 198개 정상(approved) 일괄 설정</button>
      <button class="btn btn-secondary" onclick="batchResetAll()">전체 미검토 초기화</button>
      <button class="btn btn-secondary" onclick="document.getElementById('importFileInput').click()">검토 결과 JSON 불러오기</button>
      <input type="file" id="importFileInput" style="display: none;" accept=".json" onchange="importReviewJson(event)">
      <button class="btn btn-success" onclick="exportReviewJson()">검토 결과 JSON 내보내기</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 45px;">No</th>
          <th>표제어</th>
          <th>품사</th>
          <th>대표 뜻</th>
          <th>유효 추가 뜻(다의어)</th>
          <th>난이도</th>
          <th>등급</th>
          <th>그룹</th>
          <th>근거 대조</th>
          <th style="width: 250px;">검토 액션 & 수정 제안</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

s":["어둑한","악명 높은","유치하다","정보제공자"],"correctIndex":0},"reviewStatus":"UNREVIEWED","reviewNote":"","suggestedMeaning":""},{"id":"builtin:disastrous:adjective","word":"disastrous","lemma":"disastrous","partOfSpeech":"adjective","mainMeaning":"재난의","subMeanings":[],"difficulty":"hard","confidenceGrade":"B","topics":["안전/보건","금융/회계"],"primaryCategory":"B_GRADE","allCategories":["B_GRADE"],"officialEvidenceStatus":"unknown","officialEvidence":[],"sampleQuiz":{"difficulty":"high","options":["재난의","악명 높은","유치하다","정보제공자"],"correctIndex":0},"reviewStatus":"UNREVIEWED","reviewNote":"","suggestedMeaning":""},{"id":"builtin:allegedly:adverb","word":"allegedly","lemma":"allegedly","partOfSpeech":"adverb","mainMeaning":"주장에 의하면","subMeanings":[],"difficulty":"hard","confidenceGrade":"B","topics":["회사/사무"],"primaryCategory":"B_GRADE","allCategories":["B_GRADE"],"officialEvidenceStatus":"unknown","officialEvidence":[],"sampleQuiz":{"difficulty":"high","options":["주장에 의하면","적절하게","식별하다","발췌본"],"correctIndex":0},"reviewStatus":"UNREVIEWED","reviewNote":"","suggestedMeaning":""},{"id":"builtin:conspicuously:adverb","word":"conspicuously","lemma":"conspicuously","partOfSpeech":"adverb","mainMeaning":"눈에 띄게","subMeanings":[],"difficulty":"hard","confidenceGrade":"B","topics":["판매/마케팅","일반"],"primaryCategory":"B_GRADE","allCategories":["B_GRADE"],"officialEvidenceStatus":"unknown","officialEvidence":[],"sampleQuiz":{"difficulty":"high","options":["의류","눈에 띄게","적용 가능한","표준화하다"],"correctIndex":1},"reviewStatus":"UNREVIEWED","reviewNote":"","suggestedMeaning":""},{"id":"builtin:desperately:adverb","word":"desperately","lemma":"desperately","partOfSpeech":"adverb","mainMeaning":"절박하게","subMeanings":[],"difficulty":"medium","confidenceGrade":"B","topics":["일반"],"primaryCategory":"B_GRADE","allCategories":["B_GRADE"],"officialEvidenceStatus":"unknown","officialEvidence":[],"sampleQuiz":{"difficulty":"medium","options":["절박하게","악명 높은","유치하다","정보제공자"],"correctIndex":0},"reviewStatus":"UNREVIEWED",     // 로컬 스토리지에서 이전 검토 상태 복원 (QA-03 / QA-02 호환)
    const savedReviews = JSON.parse(localStorage.getItem('voca_qa03_reviews') || localStorage.getItem('voca_qa02_reviews') || '{}');
    items.forEach(item => {
      if (savedReviews[item.id]) {
        item.reviewStatus = savedReviews[item.id].status || 'UNREVIEWED';
        item.reviewNote = savedReviews[item.id].note || '';
        item.suggestedMainMeaning = savedReviews[item.id].suggestedMainMeaning || null;
        item.suggestedSubMeanings = savedReviews[item.id].suggestedSubMeanings || [];
        item.suggestedPartOfSpeech = savedReviews[item.id].suggestedPartOfSpeech || null;
      }
    });

    function saveItem(item) {
      if (!savedReviews[item.id]) savedReviews[item.id] = {};
      savedReviews[item.id] = {
        status: item.reviewStatus,
        note: item.reviewNote || '',
        suggestedMainMeaning: item.suggestedMainMeaning || null,
        suggestedSubMeanings: item.suggestedSubMeanings || [],
        suggestedPartOfSpeech: item.suggestedPartOfSpeech || null,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem('voca_qa03_reviews', JSON.stringify(savedReviews));
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat = document.getElementById('categorySelect').value;
      const pos = document.getElementById('posSelect').value;
      const diff = document.getElementById('diffSelect').value;
      const status = document.getElementById('statusFilter').value;

      const filtered = items.filter(item => {
        if (search && !item.word.toLowerCase().includes(search) && !item.mainMeaning.includes(search)) return false;
        if (cat !== 'ALL' && item.primaryCategory !== cat) return false;
        if (pos !== 'ALL' && item.partOfSpeech !== pos) return false;
        if (diff !== 'ALL' && item.difficulty !== diff) return false;
        if (status !== 'ALL' && item.reviewStatus !== status) return false;
        return true;
      });

      const approvedCount = items.filter(i => i.reviewStatus === 'APPROVED').length;
      const correctionCount = items.filter(i => i.reviewStatus === 'NEEDS_CORRECTION').length;
      const excludeCount = items.filter(i => i.reviewStatus === 'EXCLUDE').length;
      const holdCount = items.filter(i => i.reviewStatus === 'HOLD').length;
      const unreviewedCount = items.filter(i => !i.reviewStatus || i.reviewStatus === 'UNREVIEWED').length;

      document.getElementById('countSummary').innerHTML =
        '조회: <strong>' + filtered.length + '</strong>개 / 전체 큐 198개 ' +
        '(정상: <span style="color:#34d399">' + approvedCount + '</span>, ' +
        '수정: <span style="color:#fbbf24">' + correctionCount + '</span>, ' +
        '제외: <span style="color:#f87171">' + excludeCount + '</span>, ' +
        '보류: ' + holdCount + ', ' +
        '미검토: <span style="color:#94a3b8">' + unreviewedCount + '</span>)';

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = filtered.map((item, idx) => {
        const sub = item.subMeanings && item.subMeanings.length > 0 ? item.subMeanings.join(', ') : '-';
        const isNeedsCorrection = item.reviewStatus === 'NEEDS_CORRECTION';

        let editFieldsHtml = '';
        if (isNeedsCorrection) {
          const subMeaningsStr = (item.suggestedSubMeanings || []).join(', ');
          editFieldsHtml =
            '<div style="margin-top: 6px; padding: 6px; background: rgba(0,0,0,0.4); border-radius: 4px; border: 1px dashed var(--warning); display: flex; flex-direction: column; gap: 4px;">' +
              '<input type="text" class="note-input" style="margin-top:0;" placeholder="수정 대표 뜻 (미입력시 유지)" value="' + (item.suggestedMainMeaning || '') + '" oninput="updateSuggestedMainMeaning(\'' + item.id + '\', this.value)">' +
              '<input type="text" class="note-input" style="margin-top:0;" placeholder="수정 추가 뜻 (쉼표로 구분)" value="' + subMeaningsStr + '" oninput="updateSuggestedSubMeanings(\'' + item.id + '\', this.value)">' +
              '<select class="status-select" onchange="updateSuggestedPos(\'' + item.id + '\', this.value)">' +
                '<option value="">품사 유지 (' + item.partOfSpeech + ')</option>' +
                '<option value="noun"' + (item.suggestedPartOfSpeech === 'noun' ? ' selected' : '') + '>noun (명사)</option>' +
                '<option value="verb"' + (item.suggestedPartOfSpeech === 'verb' ? ' selected' : '') + '>verb (동사)</option>' +
                '<option value="adjective"' + (item.suggestedPartOfSpeech === 'adjective' ? ' selected' : '') + '>adjective (형용사)</option>' +
                '<option value="adverb"' + (item.suggestedPartOfSpeech === 'adverb' ? ' selected' : '') + '>adverb (부사)</option>' +
                '<option value="phrase"' + (item.suggestedPartOfSpeech === 'phrase' ? ' selected' : '') + '>phrase (표현)</option>' +
              '</select>' +
            '</div>';
        }

        return '<tr>' +
          '<td>' + (idx + 1) + '</td>' +
          '<td><span class="word-title">' + item.word + '</span></td>' +
          '<td><span class="tag">' + item.partOfSpeech + '</span></td>' +
          '<td><strong>' + item.mainMeaning + '</strong></td>' +
          '<td style="color: #38bdf8; font-weight: 500;">' + sub + '</td>' +
          '<td><span class="tag">' + item.difficulty + '</span></td>' +
          '<td><span class="tag">' + item.confidenceGrade + '</span></td>' +
          '<td><span class="tag">' + item.primaryCategory + '</span></td>' +
          '<td><span class="tag">' + (item.matchType || item.officialEvidenceStatus) + '</span></td>' +
          '<td>' +
            '<select class="status-select" onchange="updateStatus(\'' + item.id + '\', this.value)">' +
              '<option value="UNREVIEWED"' + (item.reviewStatus === 'UNREVIEWED' ? ' selected' : '') + '>미검토</option>' +
              '<option value="APPROVED"' + (item.reviewStatus === 'APPROVED' ? ' selected' : '') + '>정상 (APPROVED)</option>' +
              '<option value="NEEDS_CORRECTION"' + (item.reviewStatus === 'NEEDS_CORRECTION' ? ' selected' : '') + '>수정 필요</option>' +
              '<option value="EXCLUDE"' + (item.reviewStatus === 'EXCLUDE' ? ' selected' : '') + '>제외</option>' +
              '<option value="HOLD"' + (item.reviewStatus === 'HOLD' ? ' selected' : '') + '>보류</option>' +
            '</select>' +
            '<input type="text" class="note-input" placeholder="검토 메모 / 수정 사유..." value="' + (item.reviewNote || '') + '" oninput="updateNote(\'' + item.id + '\', this.value)">' +
            editFieldsHtml +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function updateStatus(id, newStatus) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.reviewStatus = newStatus;
        saveItem(item);
        renderTable();
      }
    }

    function updateNote(id, note) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.reviewNote = note;
        saveItem(item);
      }
    }

    function updateSuggestedMainMeaning(id, val) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.suggestedMainMeaning = val.trim() || null;
        saveItem(item);
      }
    }

    function updateSuggestedSubMeanings(id, val) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.suggestedSubMeanings = val.split(',').map(s => s.trim()).filter(Boolean);
        saveItem(item);
      }
    }

    function updateSuggestedPos(id, val) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.suggestedPartOfSpeech = val.trim() || null;
        saveItem(item);
      }
    }

    function batchApproveFiltered() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat = document.getElementById('categorySelect').value;
      const pos = document.getElementById('posSelect').value;
      const diff = document.getElementById('diffSelect').value;
      const status = document.getElementById('statusFilter').value;

      const filtered = items.filter(item => {
        if (search && !item.word.toLowerCase().includes(search) && !item.mainMeaning.includes(search)) return false;
        if (cat !== 'ALL' && item.primaryCategory !== cat) return false;
        if (pos !== 'ALL' && item.partOfSpeech !== pos) return false;
        if (diff !== 'ALL' && item.difficulty !== diff) return false;
        if (status !== 'ALL' && item.reviewStatus !== status) return false;
        return true;
      });

      if (!confirm(filtered.length + '개 항목을 정상(APPROVED)으로 일괄 설정하시겠습니까?')) return;
      filtered.forEach(item => {
        item.reviewStatus = 'APPROVED';
        saveItem(item);
      });
      renderTable();
    }

    function batchApproveAll() {
      if (!confirm('198개 전체 항목을 정상(APPROVED)으로 일괄 설정하시겠습니까?\n(일괄 설정 후 수정 필요/제외 항목만 개별 변경하시면 빠릅니다.)')) return;
      items.forEach(item => {
        item.reviewStatus = 'APPROVED';
        saveItem(item);
      });
      renderTable();
    }

    function batchResetAll() {
      if (!confirm('모든 항목을 미검토(UNREVIEWED) 상태로 초기화하시겠습니까?')) return;
      items.forEach(item => {
        item.reviewStatus = 'UNREVIEWED';
        item.reviewNote = '';
        item.suggestedMainMeaning = null;
        item.suggestedSubMeanings = [];
        item.suggestedPartOfSpeech = null;
        saveItem(item);
      });
      renderTable();
    }

    function exportReviewJson() {
      const exportData = {
        databaseVersion: 4,
        reviewedAt: new Date().toISOString(),
        reviewer: "human",
        items: items.map(item => {
          let st = "unreviewed";
          if (item.reviewStatus === "APPROVED") st = "approved";
          else if (item.reviewStatus === "NEEDS_CORRECTION") st = "needs_correction";
          else if (item.reviewStatus === "EXCLUDE") st = "exclude";
          else if (item.reviewStatus === "HOLD") st = "hold";

          return {
            wordId: item.id,
            word: item.word,
            status: st,
            suggestedMainMeaning: item.suggestedMainMeaning || null,
            suggestedSubMeanings: item.suggestedSubMeanings || [],
            suggestedPartOfSpeech: item.suggestedPartOfSpeech || null,
            note: item.reviewNote || ""
          };
        })
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "word_db_1800_human_review.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importReviewJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          const rawItems = Array.isArray(imported) ? imported : (imported.items || []);
          if (rawItems.length > 0) {
            rawItems.forEach(row => {
              const item = items.find(i => i.id === (row.wordId || row.id));
              if (item) {
                const st = (row.status || row.reviewStatus || '').toLowerCase();
                if (st === 'approved' || st === 'pass') item.reviewStatus = 'APPROVED';
                else if (st === 'needs_correction') item.reviewStatus = 'NEEDS_CORRECTION';
                else if (st === 'exclude' || st === 'exclude_recommended') item.reviewStatus = 'EXCLUDE';
                else if (st === 'hold') item.reviewStatus = 'HOLD';
                else if (st === 'unreviewed') item.reviewStatus = 'UNREVIEWED';

                item.reviewNote = row.note || row.reviewNote || item.reviewNote;
                item.suggestedMainMeaning = row.suggestedMainMeaning || row.suggestedMeaning || item.suggestedMainMeaning;
                item.suggestedSubMeanings = row.suggestedSubMeanings || item.suggestedSubMeanings || [];
                item.suggestedPartOfSpeech = row.suggestedPartOfSpeech || item.suggestedPartOfSpeech;
                saveItem(item);
              }
            });
            renderTable();
            alert('성공적으로 검토 결과를 불러왔습니다: ' + rawItems.length + '건');
          }
        } catch (err) {
          alert('JSON 파싱 오류: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    renderTable();
  </script>
